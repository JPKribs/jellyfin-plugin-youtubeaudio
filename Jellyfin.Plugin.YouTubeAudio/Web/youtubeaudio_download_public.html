<!-- Content fragment injected into the base JPKribs.Jellyfin.Base status card. -->

<div id="signin" class="hidden">
    <h1 data-str="HeaderSignInRequired">Sign in required</h1>
    <p data-str="MessageSignInToView">Sign in to your account to view this page.</p>
    <a id="signinLink" class="base-btn" href="/" data-str="ButtonSignIn">Sign In</a>
</div>

<div id="denied" class="hidden">
    <h1 data-str="HeaderNotAuthorized">Not authorized</h1>
    <p data-str="MessageNoAccess">Your account doesn't have access to this page.</p>
    <a id="deniedLink" class="base-btn" href="/" data-str="ButtonBackToJellyfin">Back to Jellyfin</a>
</div>

<form id="form" class="hidden" autocomplete="off" novalidate>
    <h1 data-str="HeaderRequestDownload">Request a Download</h1>
    <p data-str="RequestDownloadIntro">Paste a YouTube link to a song or a playlist. Audio-only or lyric uploads work best.</p>

    <div class="base-fields">
        <label for="url" data-str="LabelYouTubeLink">YouTube Link</label>
        <input type="url" id="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" />

        <label for="artist" data-str="Artist">Artist</label>
        <input type="text" id="artist" list="artistList" placeholder="Artist" data-str-placeholder="Artist" />
        <datalist id="artistList"></datalist>

        <label for="album" data-str="Album">Album</label>
        <input type="text" id="album" list="albumList" placeholder="Album" data-str-placeholder="Album" />
        <datalist id="albumList"></datalist>

        <div class="base-field-pair">
            <div>
                <label for="year" data-str="LabelYear">Year</label>
                <input type="text" id="year" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="2018" />
            </div>
            <div>
                <label for="title"><span data-str="LabelTitle">Title</span> <span class="base-hint" data-str="LabelOptional">(optional)</span></label>
                <input type="text" id="title" placeholder="From the video if empty" data-str-placeholder="PlaceholderTitleFromVideo" />
            </div>
        </div>
    </div>

    <button type="submit" id="submit" class="base-submit" data-str="ButtonSubmit">Submit</button>
    <p id="msg" class="base-note" role="status" aria-live="polite"></p>
    <a id="queueLink" class="base-btn base-btn-secondary" href="Queue" data-str="ButtonViewQueue">View the Queue</a>
</form>

<script>
    (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var infoUrl = path + '/Info';
        var submitUrl = path + '/Submit';
        // Derive the Jellyfin base path by stripping this page's own "/YouTube/Download" suffix (served at any case).
        // Anchored to the end so it can't mis-split; if the suffix isn't found, fall back to the origin root.
        var prefix = location.pathname.replace(/\/youtube\/download\/?$/i, '');
        if (prefix === location.pathname) { prefix = ''; }
        var root = prefix + '/';

        var el = function (id) { return document.getElementById(id); };
        // The plugin's strings in the viewer's language, or null while they load or when Base cannot load.
        var t = null;
        // tr
        // Reads one string with its {0} filled, or the English given while the strings are missing.
        function tr(key, english, value) {
            var text = t ? t.tr(key, english) : english;
            return value === undefined ? text : text.replace('{0}', value);
        }
        function show(id) { el(id).classList.remove('hidden'); }
        function val(id) { return (el(id).value || '').trim(); }
        // Shows a result under the form, in the card's red error line when it is an error. An empty message clears it.
        function status(message, isError) {
            el('msg').className = isError ? 'base-status-error' : 'base-note';
            el('msg').textContent = message || '';
        }

        // Hide the base card's loading heading and spinner when leaving the loading state.
        function leaveLoading() {
            var h = document.querySelector('.base-status-card > h1');
            var s = document.querySelector('.base-status-card > .base-spinner');
            if (h) h.classList.add('hidden');
            if (s) s.classList.add('hidden');
        }

        ['signinLink', 'deniedLink'].forEach(function (id) { var a = el(id); if (a) a.href = root; });
        el('queueLink').href = prefix + '/YouTube/Queue';

        // getServer
        // Finds the signed in server this browser knows, preferring the one whose address matches this page.
        function getServer() {
            try {
                var raw = localStorage.getItem('jellyfin_credentials');
                if (!raw) return null;
                var creds = JSON.parse(raw);
                var servers = (creds && creds.Servers) || [];
                var withToken = [];
                for (var i = 0; i < servers.length; i++) {
                    if (servers[i] && servers[i].AccessToken) withToken.push(servers[i]);
                }
                // A browser can know several Jellyfin servers; prefer the one whose stored
                // address matches this page's origin so we don't send a foreign token.
                var origin = location.origin.replace(/\/+$/, '').toLowerCase();
                for (var j = 0; j < withToken.length; j++) {
                    var s = withToken[j];
                    var addrs = [s.ManualAddress, s.LocalAddress, s.RemoteAddress, s.Address];
                    for (var k = 0; k < addrs.length; k++) {
                        if (addrs[k] && addrs[k].replace(/\/+$/, '').toLowerCase() === origin) return s;
                    }
                }
                return withToken.length > 0 ? withToken[0] : null;
            } catch (e) { /* no token */ }
            return null;
        }

        var server = getServer();
        var token = server ? server.AccessToken : null;
        var authHeader = 'MediaBrowser Token="' + token + '"';

        // The strings load once, in the viewer's display language, before any state shows.
        var strings = import(prefix + '/web/configurationpage?name=youtubeaudio_jpkribs_shared.js')
            .then(function (kit) { return kit.loadTranslations(prefix + '/YouTubeAudio/Translations', { userId: server ? server.UserId : '' }); })
            .then(function (loaded) { t = loaded; t.apply(document); })
            .catch(function () { return null; });

        fetch(prefix + '/System/Info/Public', { headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.json(); })
            .then(function (info) {
                if (!info || !info.ServerName) return;
                strings.then(function () { document.title = info.ServerName + ' - ' + tr('Download', 'Download'); });
            })
            .catch(function () { /* keep the default title */ });

        if (!token) { strings.then(function () { leaveLoading(); show('signin'); }); return; }

        // suggest
        // Fills a field's list of suggestions from the library as the user types, after a short pause.
        //
        // Inputs
        // inputId [string]: The field.
        // listId [string]: Its datalist.
        // kind [string]: Artists or Albums.
        // getArtist [function]: Returns the artist that limits an album search [optional].
        function suggest(inputId, listId, kind, getArtist) {
            var t = null;
            el(inputId).addEventListener('input', function () {
                if (t) clearTimeout(t);
                var query = val(inputId);
                if (query.length < 2) { el(listId).innerHTML = ''; return; }
                t = setTimeout(function () {
                    var u = path + '/' + kind + '?query=' + encodeURIComponent(query);
                    if (getArtist) { var a = getArtist(); if (a) { u += '&artist=' + encodeURIComponent(a); } }
                    fetch(u, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } })
                        .then(function (r) { return r.ok ? r.json() : []; })
                        .then(function (res) {
                            var list = el(listId);
                            list.innerHTML = '';
                            (res || []).forEach(function (name) {
                                var opt = document.createElement('option');
                                opt.value = name;
                                list.appendChild(opt);
                            });
                        })
                        .catch(function () { return null; });
                }, 300);
            });
        }

        Promise.all([fetch(infoUrl, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } }), strings])
            .then(function (results) {
                var r = results[0];
                if (r.status === 401) { leaveLoading(); show('signin'); return null; }
                return r.json();
            })
            .then(function (info) {
                if (info === null) return;
                leaveLoading();
                if (info && info.Approved) {
                    suggest('artist', 'artistList', 'Artists');
                    suggest('album', 'albumList', 'Albums', function () { return val('artist'); });
                    syncTitleForPlaylist();
                    show('form');
                } else {
                    show('denied');
                }
            })
            .catch(function () { leaveLoading(); show('denied'); });

        // A playlist link downloads many tracks, so a single title doesn't apply — disable the field for playlists.
        function syncTitleForPlaylist() {
            var isPlaylist = /\/playlist/i.test(val('url'));
            var title = el('title');
            title.disabled = isPlaylist;
            if (isPlaylist) { title.value = ''; title.placeholder = tr('PlaceholderNotForPlaylists', 'Not used for playlists'); }
            else { title.placeholder = tr('PlaceholderTitleFromVideo', 'From the video if empty'); }
        }
        el('url').addEventListener('input', syncTitleForPlaylist);
        syncTitleForPlaylist();

        el('form').addEventListener('submit', function (e) {
            e.preventDefault();

            var url = val('url');
            var artist = val('artist');
            var album = val('album');
            var yearRaw = val('year');
            var title = val('title');

            if (!url || !artist || !album || !yearRaw) { status(tr('MessageEnterDetails', 'Add the YouTube link, artist, album and year.'), true); return; }
            var year = parseInt(yearRaw, 10);
            if (isNaN(year)) { status(tr('MessageEnterYear', 'Enter the year as a number, like 2018.'), true); return; }

            var btn = el('submit');
            btn.disabled = true;
            status(tr('MessageSubmitting', 'Submitting…'));

            fetch(submitUrl, {
                method: 'POST',
                headers: { 'Authorization': authHeader, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ Url: url, Artist: artist, Album: album, Year: year, Title: title || null })
            })
                .then(function (r) {
                    return r.json().then(function (data) { return { ok: r.ok, data: data }; })
                        .catch(function () { return { ok: r.ok, data: {} }; });
                })
                .then(function (res) {
                    btn.disabled = false;
                    if (!res.ok) { status((res.data && res.data.Error) || tr('ErrorSubmit', 'The request could not be submitted.'), true); return; }
                    var n = (res.data && res.data.Queued) || 0;
                    status(n === 1 ? tr('MessageTracksQueuedOne', 'Queued 1 track for download.', n) : tr('MessageTracksQueuedMany', 'Queued {0} tracks for download.', n));
                    el('form').reset();
                })
                .catch(function () { btn.disabled = false; status(tr('ErrorServerUnreachable', 'Could not reach the server. Try again.'), true); });
        });
    })();
</script>
