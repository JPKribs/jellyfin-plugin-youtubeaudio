<!-- Content fragment injected into the base JPKribs.Jellyfin.Base status card. -->
<link rel="stylesheet" href="../web/configurationpage?name=youtubeaudio_jpkribs_shared.css" />
<style>
    /* Widens the status card so the queue's rows have room. */
    .base-status-card { max-width: 760px; }
    #filter { margin: var(--base-gap-wide) 0; justify-content: center; }
    #list { text-align: left; }
</style>

<div id="signin" class="hidden">
    <h1 data-str="HeaderSignInRequired">Sign in required</h1>
    <p data-str="MessageSignInToView">Sign in to your account to view this page.</p>
    <a id="signinLink" class="base-btn" href="/" data-str="ButtonSignIn">Sign in</a>
</div>

<div id="unavailable" class="hidden">
    <h1 data-str="HeaderQueueUnavailable">Queue unavailable</h1>
    <p data-str="ErrorQueueUnavailable">The queue could not be loaded. Try again in a moment.</p>
    <a id="unavailableLink" class="base-btn" href="/" data-str="ButtonBackToJellyfin">Back to Jellyfin</a>
</div>

<div id="queue" class="hidden">
    <h1 data-str="HeaderDownloadQueue">Download queue</h1>
    <p data-str="QueueIntro">Songs waiting to be added to the music library, and where each one stands.</p>
    <div id="filter" class="base-pill-group" role="group" aria-label="Status" data-str-label="LabelStatus"></div>
    <div id="list"></div>
    <p id="updated" class="base-note"></p>
</div>

<script>
    (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var itemsUrl = path + '/Items';
        // Derive the Jellyfin base path by stripping this page's own "/YouTube/Queue" suffix (served at any case).
        var prefix = location.pathname.replace(/\/youtube\/queue\/?$/i, '');
        if (prefix === location.pathname) { prefix = ''; }
        var root = prefix + '/';
        var REFRESH_MS = 10000;
        // Each status as a pill of the list's filter, by the key that names it, and the Base badge state that colors it.
        var STATES = [
            { value: '0', key: 'StatusWaiting', state: 'Queued' },
            { value: '1', key: 'StatusDownloading', state: 'Downloading' },
            { value: '2', key: 'StatusDownloaded', state: 'Downloaded' },
            { value: '4', key: 'LabelFailed', state: 'Error' }
        ];
        var queue = null;
        var kit = null;
        // The plugin's strings in the viewer's language.
        var t = null;

        var el = function (id) { return document.getElementById(id); };
        function show(id) { el(id).classList.remove('hidden'); }
        function hide(id) { el(id).classList.add('hidden'); }

        // Hide the base card's loading heading and spinner when leaving the loading state.
        function leaveLoading() {
            var h = document.querySelector('.base-status-card > h1');
            var s = document.querySelector('.base-status-card > .base-spinner');
            if (h) h.classList.add('hidden');
            if (s) s.classList.add('hidden');
        }

        ['signinLink', 'unavailableLink'].forEach(function (id) { var a = el(id); if (a) a.href = root; });

        var serverName = null;
        fetch(prefix + '/System/Info/Public', { headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.json(); })
            .then(function (info) { if (info && info.ServerName) { serverName = info.ServerName; showTitle(); } })
            .catch(function () { /* keep the default title */ });

        // showTitle
        // Names the tab after the server and the page, once both are known.
        function showTitle() {
            if (serverName && t) document.title = serverName + ' - ' + t.tr('Queue');
        }

        // getServer
        // Finds the signed in server this browser knows, preferring the one whose address matches this page.
        function getServer() {
            try {
                var raw = localStorage.getItem('jellyfin_credentials');
                if (!raw) return null;
                var creds = JSON.parse(raw);
                var servers = (creds && creds.Servers) || [];
                var withToken = [];
                for (var i = 0; i < servers.length; i++) {
                    if (servers[i] && servers[i].AccessToken) withToken.push(servers[i]);
                }
                // Prefer the server whose stored address matches this page's origin.
                var origin = location.origin.replace(/\/+$/, '').toLowerCase();
                for (var j = 0; j < withToken.length; j++) {
                    var s = withToken[j];
                    var addrs = [s.ManualAddress, s.LocalAddress, s.RemoteAddress, s.Address];
                    for (var k = 0; k < addrs.length; k++) {
                        if (addrs[k] && addrs[k].replace(/\/+$/, '').toLowerCase() === origin) return s;
                    }
                }
                return withToken.length > 0 ? withToken[0] : null;
            } catch (e) { /* no token */ }
            return null;
        }

        var server = getServer();
        var token = server ? server.AccessToken : null;
        var authHeader = 'MediaBrowser Token="' + token + '"';

        var lastItems = [];
        var pills = null;
        var bag = null;
        var OPTIONS = [{ value: 'all', key: 'All' }].concat(STATES);

        // badgeNode
        // Draws a status as a Base status badge, a node the record list can hold.
        function badgeNode(item) {
            var state = STATES.filter(function (s) { return s.value === String(item.StatusCode); })[0];
            var holder = document.createElement('span');
            holder.innerHTML = bag.statusBadge(item.Status, state ? state.state : 'Queued');
            return holder.firstElementChild || holder;
        }

        // buildQueue
        // Builds the queue as a Base Record List, with a Base Pill Group that shows one status. Neither draws an icon, since the status card loads no icon font.
        function buildQueue() {
            queue = kit.createRecordList({
                items: [],
                maxHeight: '60vh',
                emptyText: t.tr('MessageQueueEmpty'),
                label: t.tr('HeaderDownloadQueue')
            });
            el('list').appendChild(queue.element);
            bag = kit.createShared(document, '7323ea64-a200-4265-ab8f-e7ae27d06c38', 'YouTube');
            OPTIONS.forEach(function (o) {
                var pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'base-pill';
                pill.setAttribute('data-value', o.value);
                pill.setAttribute('aria-pressed', 'false');
                el('filter').appendChild(pill);
            });
            pills = kit.createPillGroup(el('filter'), { onChange: function () { render(lastItems); } });
            pills.set('all');
        }

        // render
        // Shows the items of the chosen status, and a pill per status with its count.
        function render(items) {
            lastItems = items;
            var chosen = pills.get() || 'all';
            var counts = {};
            items.forEach(function (i) { counts[i.StatusCode] = (counts[i.StatusCode] || 0) + 1; });
            el('filter').querySelectorAll('.base-pill').forEach(function (pill) {
                var value = pill.getAttribute('data-value');
                var o = OPTIONS.filter(function (x) { return x.value === value; })[0];
                pill.textContent = t.tr(o.key) + ' ' + (value === 'all' ? items.length : counts[value] || 0);
            });
            var shown = chosen === 'all' ? items : items.filter(function (i) { return String(i.StatusCode) === chosen; });
            queue.setItems(shown.map(function (i, n) {
                return {
                    id: [i.CreatedAt, i.Source, i.Artist, i.Title, n].join('|'),
                    title: i.Title || t.tr('LabelTitleUnknown'),
                    secondary: [i.Artist, i.Album, i.Source].filter(Boolean).join(' \u00b7 '),
                    aside: badgeNode(i)
                };
            }));
        }

        var timer = null;
        function load(first) {
            fetch(itemsUrl, { headers: { 'Authorization': authHeader, 'Accept': 'application/json', 'X-Jellyfin-Plugin-Language': t.language } })
                .then(function (r) {
                    if (r.status === 401) { leaveLoading(); hide('queue'); show('signin'); return null; }
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (items) {
                    if (items === null) { if (timer) clearInterval(timer); return; }
                    leaveLoading();
                    hide('unavailable');
                    render(items || []);
                    el('updated').textContent = t.format('MessageUpdatedAt', new Date().toLocaleTimeString());
                    show('queue');
                })
                .catch(function () {
                    // Keep showing the last good list on a failed refresh; only the first load reports it.
                    if (first) { leaveLoading(); show('unavailable'); }
                });
        }

        import(prefix + '/web/configurationpage?name=youtubeaudio_jpkribs_shared.js')
            .then(function (mod) {
                kit = mod;
                return kit.loadTranslations(prefix + '/YouTubeAudio/Translations', { userId: server ? server.UserId : '' });
            })
            .then(function (loaded) {
                t = loaded;
                t.apply(document);
                showTitle();
                if (!token) { leaveLoading(); show('signin'); return; }
                buildQueue();
                load(true);
                timer = setInterval(function () { if (!document.hidden) load(false); }, REFRESH_MS);
            })
            .catch(function () { leaveLoading(); show(token ? 'unavailable' : 'signin'); });
    })();
</script>
