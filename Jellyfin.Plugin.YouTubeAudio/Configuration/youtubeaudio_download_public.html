<!-- Content fragment injected into the base JPKribs.Jellyfin.Base status card. -->
<link rel="stylesheet" href="../web/configurationpage?name=youtubeaudio_jpkribs_shared.css" />
<style>
    .yta-hint { margin: 6px 0 0; font-size: 0.82rem; line-height: 1.4; color: rgba(255,255,255,0.5); text-align: left; }
    .yta-optional { font-weight: 400; color: rgba(255,255,255,0.45); }
    /* No spinner on the year field: it is typed, not stepped. */
    #year { -moz-appearance: textfield; appearance: textfield; }
    #year::-webkit-outer-spin-button, #year::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    /* Result banner: only shown when there is something to say. */
    .yta-msg { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; text-align: left; }
    .yta-msg.info { display: block; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.75); }
    .yta-msg.success { display: block; background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.45); color: #a5d6a7; }
    .yta-msg.error { display: block; background: rgba(244,67,54,0.13); border: 1px solid rgba(244,67,54,0.45); color: #ef9a9a; }
    /* Outlined secondary button: full width like Submit, without competing with it. */
    .yta-secondary { display: block; box-sizing: border-box; width: 100%; margin-top: 12px; padding: 0.8em; border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 0.95rem; font-weight: 600; text-align: center; text-decoration: none; }
    .yta-secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
</style>

<div id="signin" class="hidden">
    <h1>Sign in required</h1>
    <p>Sign in to your account to view this page.</p>
    <a id="signinLink" class="jpk-btn" href="/">Sign in</a>
</div>

<div id="denied" class="hidden">
    <h1>Not authorized</h1>
    <p>Your account doesn't have access to this page.</p>
    <a id="deniedLink" class="jpk-btn" href="/">Back to Jellyfin</a>
</div>

<form id="form" class="hidden" autocomplete="off" novalidate>
    <h1>Request a Download</h1>
    <p>Paste a YouTube link to a song or a playlist.</p>

    <div class="jpk-fields">
        <label for="url">YouTube Link</label>
        <input type="url" id="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" />
        <p class="yta-hint">Audio-only or lyric uploads work best.</p>

        <label for="artist">Artist</label>
        <div id="artistBox"></div>

        <label for="album">Album</label>
        <div id="albumBox"></div>

        <div class="jpk-field-pair">
            <div>
                <label for="year">Year</label>
                <input type="number" id="year" inputmode="numeric" min="1500" max="3000" step="1" placeholder="e.g. 2018" />
            </div>
            <div>
                <label for="title">Title <span class="yta-optional">(optional)</span></label>
                <input type="text" id="title" placeholder="From the video if empty" />
            </div>
        </div>
    </div>

    <button type="submit" id="submit" class="jpk-submit">Submit</button>
    <div id="msg" class="yta-msg" role="status" aria-live="polite"></div>
    <a id="queueLink" class="yta-secondary" href="Queue">View the Queue</a>
</form>

<script>
    (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var infoUrl = path + '/Info';
        var submitUrl = path + '/Submit';
        // Derive the Jellyfin base path by stripping this page's own "/YouTube/Download" suffix (served at any case).
        // Anchored to the end so it can't mis-split; if the suffix isn't found, fall back to the origin root.
        var prefix = location.pathname.replace(/\/youtube\/download\/?$/i, '');
        if (prefix === location.pathname) { prefix = ''; }
        var root = prefix + '/';

        var el = function (id) { return document.getElementById(id); };
        function show(id) { el(id).classList.remove('hidden'); }
        function hide(id) { el(id).classList.add('hidden'); }
        function val(id) { return (el(id).value || '').trim(); }
        // Shows the result banner: kind is 'info', 'success' or 'error'; an empty message hides it.
        function status(message, kind) {
            var m = el('msg');
            m.textContent = message || '';
            m.className = 'yta-msg' + (message ? ' ' + (kind || 'info') : '');
        }

        // Hide the base card's loading heading + spinner when leaving the loading state.
        function leaveLoading() {
            var h = document.querySelector('.jpk-status-card > h1');
            var s = document.querySelector('.jpk-status-card > .jpk-spinner');
            if (h) h.style.display = 'none';
            if (s) s.style.display = 'none';
        }

        ['signinLink', 'deniedLink'].forEach(function (id) { var a = el(id); if (a) a.href = root; });
        el('queueLink').href = prefix + '/YouTube/Queue';

        fetch(prefix + '/System/Info/Public', { headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.json(); })
            .then(function (info) { if (info && info.ServerName) { document.title = info.ServerName + ' - Download'; } })
            .catch(function () { /* keep the default title */ });

        function getToken() {
            try {
                var raw = localStorage.getItem('jellyfin_credentials');
                if (!raw) return null;
                var creds = JSON.parse(raw);
                var servers = (creds && creds.Servers) || [];
                var withToken = [];
                for (var i = 0; i < servers.length; i++) {
                    if (servers[i] && servers[i].AccessToken) withToken.push(servers[i]);
                }
                // A browser can know several Jellyfin servers; prefer the one whose stored
                // address matches this page's origin so we don't send a foreign token.
                var origin = location.origin.replace(/\/+$/, '').toLowerCase();
                for (var j = 0; j < withToken.length; j++) {
                    var s = withToken[j];
                    var addrs = [s.ManualAddress, s.LocalAddress, s.RemoteAddress, s.Address];
                    for (var k = 0; k < addrs.length; k++) {
                        if (addrs[k] && addrs[k].replace(/\/+$/, '').toLowerCase() === origin) return s.AccessToken;
                    }
                }
                return withToken.length > 0 ? withToken[0].AccessToken : null;
            } catch (e) { /* no token */ }
            return null;
        }

        var token = getToken();
        var authHeader = 'MediaBrowser Token="' + token + '"';
        var artistControl = null;
        var albumControl = null;

        if (!token) { leaveLoading(); show('signin'); return; }

        function lookup(kind, getArtist) {
            var t = null;
            return function (query, cb) {
                if (t) clearTimeout(t);
                if (!query || query.length < 2) { cb([]); return; }
                t = setTimeout(function () {
                    var u = path + '/' + kind + '?query=' + encodeURIComponent(query);
                    if (getArtist) { var a = getArtist(); if (a) { u += '&artist=' + encodeURIComponent(a); } }
                    fetch(u, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } })
                        .then(function (r) { return r.ok ? r.json() : []; })
                        .then(function (res) { cb(res || []); })
                        .catch(function () { cb([]); });
                }, 300);
            };
        }

        function makeControl(boxId, placeholder, searchFn, shared) {
            var box = el(boxId);
            if (shared && searchFn) {
                var combo = shared.createSearchableComboBox({ placeholder: placeholder, searchFn: searchFn });
                box.appendChild(combo.element);
                return combo;
            }
            var input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder;
            box.appendChild(input);
            return { getValue: function () { return input.value; }, setValue: function (v) { input.value = v || ''; } };
        }

        function buildControls(shared) {
            artistControl = makeControl('artistBox', 'Type to search artists…', lookup('Artists'), shared);
            albumControl = makeControl('albumBox', 'Type to search albums…', lookup('Albums', function () { return artistControl.getValue(); }), shared);
        }

        function gate(shared) {
            fetch(infoUrl, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } })
                .then(function (r) {
                    if (r.status === 401) { leaveLoading(); show('signin'); return null; }
                    return r.json();
                })
                .then(function (info) {
                    if (info === null) return;
                    leaveLoading();
                    if (info && info.Approved) { buildControls(shared); show('form'); } else { show('denied'); }
                })
                .catch(function () { leaveLoading(); show('denied'); });
        }

        // createSearchableComboBox lives on the shared bag, not the module — build it from createShared.
        import(prefix + '/web/configurationpage?name=youtubeaudio_jpkribs_shared.js')
            .then(function (mod) { gate(mod.createShared(document, '7323ea64-a200-4265-ab8f-e7ae27d06c38', 'YouTube')); })
            .catch(function () { gate(null); });

        // A playlist link downloads many tracks, so a single title doesn't apply — disable the field for playlists.
        function syncTitleForPlaylist() {
            var isPlaylist = /\/playlist/i.test(val('url'));
            var title = el('title');
            title.disabled = isPlaylist;
            if (isPlaylist) { title.value = ''; title.placeholder = 'Not used for playlists'; }
            else { title.placeholder = 'From the video if empty'; }
        }
        el('url').addEventListener('input', syncTitleForPlaylist);
        syncTitleForPlaylist();

        el('form').addEventListener('submit', function (e) {
            e.preventDefault();

            var url = val('url');
            var artist = (artistControl ? artistControl.getValue() : '').trim();
            var album = (albumControl ? albumControl.getValue() : '').trim();
            var yearRaw = val('year');
            var title = val('title');

            if (!url || !artist || !album || !yearRaw) { status('Add the YouTube link, artist, album and year.', 'error'); return; }
            var year = parseInt(yearRaw, 10);
            if (isNaN(year)) { status('Enter the year as a number, like 2018.', 'error'); return; }

            var btn = el('submit');
            btn.disabled = true;
            status('Submitting…', 'info');

            fetch(submitUrl, {
                method: 'POST',
                headers: { 'Authorization': authHeader, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ Url: url, Artist: artist, Album: album, Year: year, Title: title || null })
            })
                .then(function (r) {
                    return r.json().then(function (data) { return { ok: r.ok, data: data }; })
                        .catch(function () { return { ok: r.ok, data: {} }; });
                })
                .then(function (res) {
                    btn.disabled = false;
                    if (!res.ok) { status((res.data && res.data.Error) || 'The request could not be submitted.', 'error'); return; }
                    var n = (res.data && res.data.Queued) || 0;
                    status('Queued ' + n + ' track' + (n === 1 ? '' : 's') + ' for download.', 'success');
                    el('form').reset();
                    if (artistControl && artistControl.setValue) artistControl.setValue('');
                    if (albumControl && albumControl.setValue) albumControl.setValue('');
                })
                .catch(function () { btn.disabled = false; status('Could not reach the server. Please try again.', 'error'); });
        });
    })();
</script>
