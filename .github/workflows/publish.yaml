name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get Release Info
        id: release_info
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Extract version and targetAbi from build.yaml
          BUILD_VERSION=$(grep '^version:' build.yaml | sed 's/version: *"\?\([^"]*\)"\?.*/\1/' | tr -d '"')
          TARGET_ABI=$(grep '^targetAbi:' build.yaml | sed 's/targetAbi: *"\?\([^"]*\)"\?.*/\1/' | tr -d '"')

          # Try to download the checksum file from the release assets
          ASSET_URL="https://github.com/JPKribs/jellyfin-plugin-youtubeaudio/releases/download/${TAG}/jellyfin-plugin-youtubeaudio-${BUILD_VERSION}.zip.md5"
          echo "Trying to download checksum from: ${ASSET_URL}"

          CHECKSUM=$(curl -sfL "${ASSET_URL}" 2>/dev/null || echo "")

          # If curl failed or returned empty, calculate checksum ourselves
          if [ -z "$CHECKSUM" ]; then
            echo "Checksum download failed, calculating from ZIP file..."
            ZIP_URL="https://github.com/JPKribs/jellyfin-plugin-youtubeaudio/releases/download/${TAG}/jellyfin-plugin-youtubeaudio-${BUILD_VERSION}.zip"
            curl -L -o temp_plugin.zip "${ZIP_URL}"
            CHECKSUM=$(md5sum temp_plugin.zip | cut -d' ' -f1)
            rm temp_plugin.zip
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Build Version: ${BUILD_VERSION}"
          echo "Target ABI: ${TARGET_ABI}"
          echo "Checksum: ${CHECKSUM}"

          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "target_abi=${TARGET_ABI}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Update Manifest
        env:
          # The release body and every other value reach the shell only through environment
          # variables, never through template interpolation, so quotes or $() in a changelog
          # cannot execute or break the job.
          RELEASE_BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
          BUILD_VERSION: ${{ steps.release_info.outputs.build_version }}
          TARGET_ABI: ${{ steps.release_info.outputs.target_abi }}
          CHECKSUM: ${{ steps.release_info.outputs.checksum }}
          TIMESTAMP: ${{ steps.release_info.outputs.timestamp }}
        run: |
          # Sanitize changelog by removing backticks
          SANITIZED_CHANGELOG=$(printf '%s' "$RELEASE_BODY" | tr -d '`')

          # Use jq to safely construct the JSON object
          NEW_VERSION=$(jq -n \
            --arg version "$BUILD_VERSION" \
            --arg changelog "$SANITIZED_CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
            --arg sourceUrl "https://github.com/JPKribs/jellyfin-plugin-youtubeaudio/releases/download/${TAG}/jellyfin-plugin-youtubeaudio-${BUILD_VERSION}.zip" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            '{
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            }')

          # Add new version to the beginning of versions array
          jq --argjson newVersion "$NEW_VERSION" '.[0].versions = [$newVersion] + .[0].versions' manifest.json > manifest_temp.json
          mv manifest_temp.json manifest.json

      - name: Commit Changes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifest.json
          git commit -m "Update manifest for release ${TAG}" || exit 0
          git push origin HEAD:master
