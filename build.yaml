framework: "net10.0"
overview: "Download YouTube audio directly to a Jellyfin Music Library."
description: >
  YouTube Audio lets you download YouTube audio (single videos or playlists) as Opus, MP3, or M4A files,
  review and edit metadata in a staging area, then push files into your Jellyfin music library.
  Uses yt-dlp for downloading and TagLibSharp for metadata tagging.
category: "Music"
imageUrl: "https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-youtubeaudio/refs/heads/master/Jellyfin.Plugin.YouTubeAudio/Assets/Logo.png"
owner: "JPKribs"
artifacts:
- "Jellyfin.Plugin.YouTubeAudio.dll"
- "YoutubeDLSharp.dll"
- "TagLibSharp.dll"
changelog:
  developer:
  - Bump Base to 2026.7.31
  - Recover items stuck in Downloading after a server restart
  - Fix double-download race between overlapping process requests
  - Surface background download failures as Error instead of silently staying Queued
  - Re-apply SQLite busy_timeout when the connection is recycled
  - Require http/https scheme on submitted YouTube URLs
  - Prefer the YouTube Music track name for titles, including playlist entries
  - Stop re-cleaning admin-saved titles at import; clean titles once, when written
  - Download queue processing now runs in the background (no more request timeouts on large batches)
  - Preserve queue selection across auto-refresh
  - Trigger a library scan after import so new files appear immediately
  - Add an Update yt-dlp button under Settings -> Troubleshooting
  - Remove queue rows once imported instead of keeping them forever
  - Deterministic queue ordering for same-timestamp playlist items
  - Public download page picks the credential matching the server address
  - Rebuilt for Jellyfin 12.0 on .NET 10, with the target ABI raised to 12.0.0.0
  - The dashboard menu entry now shows a music_note icon instead of the generic folder
  - CI builds, tests, and CodeQL now run on .NET 10, and label sync has the token scope it needs
