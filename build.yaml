framework: "net10.0"
overview: "Download YouTube audio directly to a Jellyfin Music Library."
description: >
  YouTube Audio lets you download YouTube audio (single videos or playlists) as Opus, MP3, or M4A files,
  review and edit metadata in a staging area, then push files into your Jellyfin music library.
  Uses yt-dlp for downloading and TagLibSharp for metadata tagging.
category: "Music"
imageUrl: "https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-youtubeaudio/refs/heads/master/Jellyfin.Plugin.YouTubeAudio/Assets/Logo.png"
owner: "JPKribs"
artifacts:
- "Jellyfin.Plugin.YouTubeAudio.dll"
- "YoutubeDLSharp.dll"
- "TagLibSharp.dll"
changelog:
  features:
  - Import Spotify playlists exported with Exportify, one playlist as CSV or all of them as a ZIP.
  - Spotify imports embed Spotify's album cover and fill in the genre from Apple Music.
  - Playlist tracks with an ISRC are matched to their official YouTube upload by it first.
  - Generate a cover with the wand button on the Import tab; choose its text, order and colors in Settings → Album Art.
  - Composer credits are stored as separate composers.
  - Live, remix, cover, acoustic and instrumental versions are never matched unless the song's title names that version.
