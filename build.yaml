framework: "net10.0"
overview: "Download YouTube audio directly to a Jellyfin Music Library."
description: >
  YouTube Audio lets you download YouTube audio (single videos or playlists) as Opus, MP3, or M4A files,
  review and edit metadata in a staging area, then push files into your Jellyfin music library.
  Uses yt-dlp for downloading and TagLibSharp for metadata tagging.
category: "Music"
imageUrl: "https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-youtubeaudio/refs/heads/master/Jellyfin.Plugin.YouTubeAudio/Assets/Logo.png"
owner: "JPKribs"
artifacts:
- "Jellyfin.Plugin.YouTubeAudio.dll"
- "YoutubeDLSharp.dll"
- "TagLibSharp.dll"
changelog:
  features:
  - When Apple Music has no cover, the album cover from the official YouTube Music track is used.
  - Re-pitched, sped-up, 8D and nightcore uploads are never matched.
  - Artists YouTube Music credits in another alphabet (such as Cyrillic) are matched by album or exact length.
  - Re-importing a playlist removes queued or failed songs your library now has.
