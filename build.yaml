framework: "net10.0"
overview: "Download YouTube audio directly to a Jellyfin Music Library."
description: >
  YouTube Audio lets you download YouTube audio (single videos or playlists) as Opus, MP3, or M4A files,
  review and edit metadata in a staging area, then push files into your Jellyfin music library.
  Uses yt-dlp for downloading and TagLibSharp for metadata tagging.
category: "Music"
imageUrl: "https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-youtubeaudio/refs/heads/master/Jellyfin.Plugin.YouTubeAudio/Assets/Logo.png"
owner: "JPKribs"
artifacts:
- "Jellyfin.Plugin.YouTubeAudio.dll"
- "YoutubeDLSharp.dll"
- "TagLibSharp.dll"
changelog:
  features:
  - Look up each download on Apple Music to fill in its title, album, album artist, year, track number and genre (Settings, on by default).
  - Embed the album cover from Apple Music in downloaded files (Settings, on by default).
  - Songs already in your library are marked "Already in your library" on the Import tab.
  - Joint artist credits are stored as separate artists, and new imports reuse the library's spelling of an artist.
  - Playlist imports use the album's release date for its year.
