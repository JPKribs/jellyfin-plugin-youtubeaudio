overview: "Download YouTube audio directly to a Jellyfin Music Library."
description: >
  YouTube Audio lets you download YouTube audio (single videos or playlists) as Opus, MP3, or M4A files,
  review and edit metadata in a staging area, then push files into your Jellyfin music library.
  Uses yt-dlp for downloading and TagLibSharp for metadata tagging.
category: "Music"
